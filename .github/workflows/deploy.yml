name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/publish-site.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: toolcraft-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_ROOT: /var/www/toolcraft.ermolaev.site

jobs:
  deploy:
    runs-on: [self-hosted, toolcraft-deploy]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build examples
        run: pnpm run build:examples

      - name: Publish to ${{ env.SITE_ROOT }}
        run: bash scripts/publish-site.sh
        env:
          SITE_ROOT: ${{ env.SITE_ROOT }}

      - name: Smoke check published demos
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null "https://toolcraft.ermolaev.site/"
          curl -fsS -o /dev/null "https://toolcraft.ermolaev.site/demos/"
          curl -fsS -o /dev/null "https://toolcraft.ermolaev.site/demos/glass/"
          curl -fsS "https://toolcraft.ermolaev.site/demos/aura-carousel/" | grep -Fq "/demos/aura-carousel/"
          curl -fsS "https://toolcraft.ermolaev.site/demos/neon-globe/" | grep -Fq "/demos/neon-globe/"
