name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/publish-site.sh"
      - "scripts/publish-site.test.sh"
      - "scripts/publish-site-fixture.mjs"
      - "scripts/build-examples.mjs"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: toolcraft-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_ROOT: /var/www/toolcraft.ermolaev.site
  SITE_URL: https://toolcraft.ermolaev.site

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, toolcraft-deploy]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Test site publish
        run: bash scripts/publish-site.test.sh

      - run: pnpm install --frozen-lockfile

      - name: Build examples
        run: pnpm run build:examples

      - name: Publish to ${{ env.SITE_ROOT }}
        run: bash scripts/publish-site.sh
        env:
          SITE_ROOT: ${{ env.SITE_ROOT }}
          SITE_URL: ${{ env.SITE_URL }}
